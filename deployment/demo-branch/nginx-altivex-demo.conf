# =====================================================================
# nginx server block — ALTIVEX Demo (PRODUCTION / HTTPS)
# ---------------------------------------------------------------------
# Pakai file ini SETELAH certbot sukses issue cert untuk
# `altivex-demo.duckdns.org`.
#
# Cara pakai (di VM):
#   sudo cp ~/ALTIVEX/deployment/demo-branch/nginx-altivex-demo.conf \
#       /etc/nginx/sites-available/altivex-demo
#   sudo ln -sf /etc/nginx/sites-available/altivex-demo \
#       /etc/nginx/sites-enabled/altivex-demo
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing:
#   altivex-demo.duckdns.org → 127.0.0.1:8081 (backend demo container)
#
# Backend prod (`altivex-pangrango.duckdns.org` → :8080) TIDAK ter-pengaruh.
# =====================================================================

# WebSocket upgrade map — `Upgrade` header trigger keep-alive untuk /ws.
# Pakai map (bukan if) supaya nginx bisa cache decision.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
# Plain HTTP — redirect ke HTTPS, kecuali ACME challenge.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name altivex-demo.duckdns.org;

    # Let's Encrypt renew via HTTP-01 — biarkan plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Semua request lain → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# HTTPS — proxy ke backend demo (port 8081).
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altivex-demo.duckdns.org;

    # Cert dari Let's Encrypt (di-manage certbot — auto-renew tiap 60 hari).
    ssl_certificate     /etc/letsencrypt/live/altivex-demo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altivex-demo.duckdns.org/privkey.pem;

    # TLS profile modern (Mozilla intermediate).
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;
    ssl_ciphers                'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hapus header Server bawaan supaya tidak bocor versi nginx.
    server_tokens off;

    # Compression — Leaflet basemap tile + GeoJSON jalur biasanya gzip-friendly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Body size — frontend kirim Excel export sampai ~5MB di prod, demo
    # gak bakal lebih besar.
    client_max_body_size 10m;

    # Tunggu lebih lama dari default 60s — WebSocket /ws idle butuh
    # ping/pong tiap 30s, plus polling fallback 30s. 5 menit aman.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # ACME challenge tetap accessible via HTTP (lihat block listen 80
    # di atas). Block HTTPS ini gak handle ACME.

    # ---------------------------------------------------------------
    # WebSocket endpoint — frontend connect ke wss://.../ws untuk
    # menerima broadcast posisi pendaki real-time.
    # ---------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket bisa idle lama, jangan timeout cepat.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------
    # Semua request lain → backend demo container (port 8081).
    # Backend yang serve static file (index.html, dashboard.js, GEO.json)
    # via `actix_files::Files`.
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
