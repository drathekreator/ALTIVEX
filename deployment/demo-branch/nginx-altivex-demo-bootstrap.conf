# =====================================================================
# nginx server block — ALTIVEX Demo (BOOTSTRAP / HTTP-only)
# ---------------------------------------------------------------------
# File ini dipakai SEKALI saat first deploy supaya certbot bisa issue
# cert via HTTP-01 challenge. Setelah cert ke-issue, ganti dengan
# `nginx-altivex-demo.conf` (versi HTTPS).
#
# Cara pakai (di VM):
#   sudo cp ~/ALTIVEX/deployment/demo-branch/nginx-altivex-demo-bootstrap.conf \
#       /etc/nginx/sites-available/altivex-demo
#   sudo ln -sf /etc/nginx/sites-available/altivex-demo \
#       /etc/nginx/sites-enabled/altivex-demo
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot --nginx -d altivex-demo.duckdns.org \
#       --non-interactive --agree-tos --email <email-anda>
#
# Setelah cert ke-issue, certbot akan auto-update file ini ke versi
# HTTPS. Atau replace manual dengan nginx-altivex-demo.conf di folder
# ini.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name altivex-demo.duckdns.org;

    # ACME challenge (Let's Encrypt) — certbot taruh challenge file
    # di sini saat issue/renew cert.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Sebelum cert ke-issue, semua request lain di-proxy ke backend
    # demo (port 8081). Setelah HTTPS aktif, file ini di-replace
    # sehingga HTTP cuma redirect ke HTTPS.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
