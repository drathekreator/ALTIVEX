# =====================================================================
# ALTIVEX Demo Branch — Isolated stack
# ---------------------------------------------------------------------
# Jalankan dari repo root:
#   docker compose -f deployment/demo-branch/docker-compose.demo.yml up -d --build
#
# Stack ini SEPENUHNYA terpisah dari prod:
#   - Postgres sendiri (volume pgdata_demo)
#   - Mosquitto sendiri (port 1884)
#   - Backend sendiri (port 8081)
#   - Credential sendiri (.env.demo)
# =====================================================================

services:
  postgres-demo:
    image: postgres:15-alpine
    container_name: altivex_postgres_demo
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diset di .env.demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset di .env.demo}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum diset di .env.demo}
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto-demo:
    image: eclipse-mosquitto:2
    container_name: altivex_mosquitto_demo
    ports:
      - "1885:1883"
    volumes:
      - ./mosquitto-demo/config:/mosquitto/config:ro
      - ./mosquitto-demo/data:/mosquitto/data
      - ./mosquitto-demo/log:/mosquitto/log
    restart: always

  backend-demo:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: altivex_backend_demo
    depends_on:
      postgres-demo:
        condition: service_healthy
      mosquitto-demo:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL belum diset di .env.demo}
      MQTT_BROKER_HOST: mosquitto-demo
      MQTT_BROKER_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME belum diset di .env.demo}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD belum diset di .env.demo}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN belum diset di .env.demo}
      BASECAMP_USERNAME: ${BASECAMP_USERNAME:?BASECAMP_USERNAME belum diset di .env.demo}
      BASECAMP_PASSWORD: ${BASECAMP_PASSWORD:?BASECAMP_PASSWORD belum diset di .env.demo}
      SERIAL_PORT: /dev/null
      RUST_LOG: info
    volumes:
      # Override GEO.json dengan peta gunung demo
      - ./frontend-override/GEO.json:/app/frontend/GEO.json:ro
    restart: always

volumes:
  pgdata_demo:
