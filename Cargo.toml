[package]
name = "altivex_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework super cepat
actix-web = "4"
# Async runtime untuk menangani banyak request
tokio = { version = "1", features = ["full"] }
# SQLx untuk komunikasi database Postgres yang aman
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
# Serde untuk mem-parsing data JSON dari LoRa
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Untuk membaca file .env
dotenvy = "0.15"
actix-files = "0.6"
serialport = "4.3"
actix = "0.13"
actix-web-actors = "4.3"
rumqttc = "0.24"
chrono = { version = "0.4", features = ["serde"] }
# Geofence check server-side — load GEO.json, polygon-in-point test
# untuk auto-trigger alert ke basecamp saat pendaki keluar koridor.
geojson = "0.24"
geo = "0.27"

# Dev-dependencies untuk exploration test (PBT — Bug Condition).
# Ditambahkan oleh task 1 spec altivex-critical-fixes.
[dev-dependencies]
proptest = "1"
