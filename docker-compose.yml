# =====================================================================
# ALTIVEX backend — production-ready compose
# ---------------------------------------------------------------------
# Sebelum `docker compose up -d` PERTAMA KALI:
#   1. Copy `.env.example` → `.env`. Isi dengan secret produksi.
#   2. Generate `mosquitto/config/passwd`:
#        docker run --rm -v "$PWD/mosquitto/config":/work \
#            -w /work eclipse-mosquitto:latest \
#            mosquitto_passwd -b -c passwd <username> <password>
#      Username + password harus match `MQTT_USERNAME` / `MQTT_PASSWORD`
#      di `.env`. File `passwd` SHALL NOT di-commit (ada di .gitignore).
#   3. Verifikasi `.env` punya `API_AUTH_TOKEN` dengan token panjang
#      acak (mis. `openssl rand -hex 32`).
#
# Reverse proxy (nginx / traefik) di-deploy di luar compose ini untuk
# TLS termination + routing /api/* ke backend.
# =====================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: altivex_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diset di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset di .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum diset di .env}
    # Tidak publish port 5432 ke host — backend akses lewat hostname
    # `postgres:5432` di network compose internal. Aktifkan baris di
    # bawah hanya untuk debugging local DB connection.
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: altivex_mosquitto
    # Port 1883 dipublish ke host supaya device ESP32 di lapangan dapat
    # publish lewat internet (GCP firewall rule `altivex-mqtt` membuka
    # tcp/1883 untuk tag `mqtt-broker`). Auth tetap WAJIB lewat
    # `mosquitto/config/passwd` — `allow_anonymous false` di
    # `mosquitto/config/mosquitto.conf` (Bug B2 / Task 3.7).
    #
    # ⚠️ Untuk mode TLS-only (port 8883), terminate TLS di Caddy /
    # nginx host dan tutup publish 1883 di sini — lihat
    # `deployment/multi-project-host/README.md` § "MQTTS via Caddy".
    ports:
      - "1883:1883"
    # Port 9001 (websocket MQTT) — aktifkan kalau frontend perlu
    # subscribe MQTT langsung. Default-nya off.
    # ports:
    #   - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altivex_backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # `?` operator: gagal-loud kalau env wajib belum di-set di host.
      # Lebih baik daripada fallback diam-diam ke nilai default yang
      # tidak aman di production.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL belum diset di .env}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mosquitto}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME belum diset di .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD belum diset di .env}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN belum diset di .env}
      BASECAMP_USERNAME: ${BASECAMP_USERNAME:?BASECAMP_USERNAME belum diset di .env}
      BASECAMP_PASSWORD: ${BASECAMP_PASSWORD:?BASECAMP_PASSWORD belum diset di .env}
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyUSB0}
      RUST_LOG: ${RUST_LOG:-info}
    # Akses ke port serial host (kalau memang ada Heltec basecamp
    # dicolok ke server). Comment baris ini di lingkungan tanpa
    # perangkat serial.
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    restart: always

volumes:
  pgdata:
