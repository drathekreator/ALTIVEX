version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: altivex_postgres
    environment:
      POSTGRES_USER: altivex
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: altivex_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: altivex_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  backend:
    build: .
    container_name: altivex_backend
    depends_on:
      - postgres
      - mosquitto
    ports:
      - "80:8080"
    environment:
      - DATABASE_URL=postgres://altivex:rahasia@postgres:5432/altivex_db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    restart: always

volumes:
  pgdata:
