version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: altivex_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-altivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rahasia}
      POSTGRES_DB: ${POSTGRES_DB:-altivex_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: altivex_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  backend:
    build: .
    container_name: altivex_backend
    depends_on:
      - postgres
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyUSB0}
    restart: always

volumes:
  pgdata:
