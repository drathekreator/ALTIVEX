<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, sans-serif">
  <!-- ALTIVEX Arsitektur Sistem (light theme) -->
  <!-- Cocok untuk laporan akhir / slide background putih / cream. -->

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2EC27E"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E0A100"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFF6E4"/>

  <!-- Title -->
  <text x="640" y="60" text-anchor="middle" font-size="36" font-weight="800"
        fill="#1A1A1A" letter-spacing="2">ARSITEKTUR SISTEM</text>
  <text x="640" y="92" text-anchor="middle" font-size="14" font-weight="400"
        fill="#6B5E47" letter-spacing="1">Tracker Pendaki Cerdas — End-to-End IoT Pipeline</text>

  <!-- Layer labels -->
  <g font-size="11" font-weight="600" fill="#2EC27E" letter-spacing="1.5">
    <text x="40"  y="200">LAPISAN 1</text>
    <text x="40"  y="218" font-size="10" fill="#6B5E47" font-weight="400">EDGE / DEVICE</text>
    <text x="40"  y="395">LAPISAN 2</text>
    <text x="40"  y="413" font-size="10" fill="#6B5E47" font-weight="400">CLOUD BACKEND</text>
    <text x="40"  y="610">LAPISAN 3</text>
    <text x="40"  y="628" font-size="10" fill="#6B5E47" font-weight="400">DASHBOARD</text>
  </g>

  <!-- Device Pendaki -->
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="220" rx="155" ry="50" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="320" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Device Pendaki</text>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#1A1A1A">ESP32 + GPS NEO-6M</text>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#2EC27E">Mengirim posisi tiap 5 detik</text>

  <!-- Device Basecamp -->
  <g filter="url(#shadow)">
    <ellipse cx="960" cy="220" rx="155" ry="50" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="960" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Device Basecamp</text>
  <text x="960" y="230" text-anchor="middle" font-size="11" fill="#1A1A1A">ESP32 + Buzzer + Tombol Ack</text>
  <text x="960" y="248" text-anchor="middle" font-size="10" fill="#2EC27E">Pos pendakian / Warung Tepi Hutan</text>

  <line x1="475" y1="220" x2="805" y2="220" stroke="#1A1A1A" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrow-dark)"/>
  <rect x="595" y="200" width="90" height="22" rx="11"
        fill="#FFF6E4" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="640" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">LoRa SX1276</text>

  <!-- Cloud container -->
  <rect x="180" y="320" width="920" height="180" rx="16"
        fill="#FFFBEB" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="340" font-size="10" font-weight="600" fill="#2EC27E" letter-spacing="1">
    GCP VM · DOCKER COMPOSE · NGINX TLS
  </text>

  <g filter="url(#shadow)">
    <ellipse cx="290" cy="425" rx="100" ry="42" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="290" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">MQTT Broker</text>
  <text x="290" y="438" text-anchor="middle" font-size="11" fill="#1A1A1A">Mosquitto 2 · QoS 1</text>

  <g filter="url(#shadow)">
    <ellipse cx="640" cy="425" rx="130" ry="55" fill="#F5B700" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="640" y="412" text-anchor="middle" font-size="16" font-weight="800" fill="#1A1A1A">Backend Rust</text>
  <text x="640" y="432" text-anchor="middle" font-size="11" fill="#1A1A1A">Actix-web · Geofence Engine</text>
  <text x="640" y="450" text-anchor="middle" font-size="10" fill="#1A1A1A" font-weight="700">Auto-Alert (3 jenis)</text>

  <g filter="url(#shadow)">
    <ellipse cx="990" cy="425" rx="100" ry="42" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="990" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">PostgreSQL 15</text>
  <text x="990" y="438" text-anchor="middle" font-size="11" fill="#1A1A1A">log_sensor · pendaki</text>

  <line x1="390" y1="425" x2="510" y2="425" stroke="#2EC27E" stroke-width="2"
        marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <line x1="770" y1="425" x2="890" y2="425" stroke="#2EC27E" stroke-width="2"
        marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>

  <path d="M 960 270 Q 960 295 290 295 Q 290 320 290 383" fill="none"
        stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4"
        marker-end="url(#arrow-dark)"/>
  <rect x="585" y="282" width="125" height="22" rx="11"
        fill="#FFF6E4" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="647" y="297" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">WiFi · MQTT publish</text>

  <path d="M 770 410 Q 1130 410 1130 220 Q 1130 195 1115 195" fill="none"
        stroke="#E0A100" stroke-width="2" stroke-dasharray="2 4"
        marker-end="url(#arrow-warn)"/>
  <rect x="1145" y="305" width="105" height="22" rx="11"
        fill="#FFF6E4" stroke="#E0A100" stroke-width="1.5"/>
  <text x="1197" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#E0A100">alert otomatis</text>

  <!-- Dashboard -->
  <g filter="url(#shadow)">
    <rect x="285" y="600" width="710" height="80" rx="40"
          fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <text x="640" y="630" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">
    Web Dashboard — altivex-pangrango.duckdns.org
  </text>
  <text x="640" y="652" text-anchor="middle" font-size="11" fill="#1A1A1A">
    Leaflet.js (peta) · Turf.js (geofence) · WebSocket real-time
  </text>
  <text x="640" y="668" text-anchor="middle" font-size="10" fill="#2EC27E">
    Tracking · Banner alert · Riwayat polyline · Export Excel
  </text>

  <line x1="640" y1="480" x2="640" y2="600" stroke="#2EC27E" stroke-width="2"
        marker-end="url(#arrow-green)"/>
  <rect x="555" y="528" width="170" height="22" rx="11"
        fill="#FFF6E4" stroke="#2EC27E" stroke-width="1.5"/>
  <text x="640" y="543" text-anchor="middle" font-size="11" font-weight="600" fill="#2EC27E">
    WebSocket / REST API
  </text>

  <!-- Legenda -->
  <g transform="translate(1050, 575)" font-size="10" fill="#1A1A1A">
    <text x="0" y="0" font-weight="700" letter-spacing="1">LEGENDA</text>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="26" y="18">jalur LoRa / WiFi</text>
    <line x1="0" y1="32" x2="20" y2="32" stroke="#2EC27E" stroke-width="2"/>
    <text x="26" y="36">jalur internal cloud</text>
    <line x1="0" y1="50" x2="20" y2="50" stroke="#E0A100" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="26" y="54">alert otomatis</text>
  </g>

</svg>
