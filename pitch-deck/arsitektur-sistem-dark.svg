<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, sans-serif">
  <!-- ALTIVEX Arsitektur Sistem (dark theme) -->
  <!-- Cocok dengan slide deck warna background #0F1410 / black -->
  <!-- Drag & drop ke Canva — SVG vector, tidak akan pixelated. -->

  <defs>
    <!-- Soft glow utk node -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Marker arrow -->
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E8EFE5"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7FB069"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F5B700"/>
    </marker>
  </defs>

  <!-- Background (transparent untuk drag-drop ke slide apapun) -->
  <rect width="1280" height="720" fill="#0F1410"/>

  <!-- ════════ TITLE ════════ -->
  <text x="640" y="60" text-anchor="middle" font-size="36" font-weight="800"
        fill="#FFFFFF" letter-spacing="2">ARSITEKTUR SISTEM</text>
  <text x="640" y="92" text-anchor="middle" font-size="14" font-weight="400"
        fill="#9DA8A0" letter-spacing="1">Tracker Pendaki Cerdas — End-to-End IoT Pipeline</text>

  <!-- ════════ LAYER LABELS (kiri) ════════ -->
  <g font-size="11" font-weight="600" fill="#7FB069" letter-spacing="1.5">
    <text x="40"  y="200" text-anchor="start">LAPISAN 1</text>
    <text x="40"  y="218" text-anchor="start" font-size="10" fill="#9DA8A0" font-weight="400">EDGE / DEVICE</text>

    <text x="40"  y="395" text-anchor="start">LAPISAN 2</text>
    <text x="40"  y="413" text-anchor="start" font-size="10" fill="#9DA8A0" font-weight="400">CLOUD BACKEND</text>

    <text x="40"  y="610" text-anchor="start">LAPISAN 3</text>
    <text x="40"  y="628" text-anchor="start" font-size="10" fill="#9DA8A0" font-weight="400">DASHBOARD</text>
  </g>

  <!-- ════════ LAYER 1: EDGE ════════ -->

  <!-- Device Pendaki -->
  <g filter="url(#glow)">
    <ellipse cx="320" cy="220" rx="155" ry="50" fill="#1A2620" stroke="#7FB069" stroke-width="2"/>
  </g>
  <text x="320" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Device Pendaki</text>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#B5C9B0">ESP32 + GPS NEO-6M</text>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#7FB069">Mengirim posisi tiap 5 detik</text>

  <!-- Device Basecamp -->
  <g filter="url(#glow)">
    <ellipse cx="960" cy="220" rx="155" ry="50" fill="#1A2620" stroke="#7FB069" stroke-width="2"/>
  </g>
  <text x="960" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Device Basecamp</text>
  <text x="960" y="230" text-anchor="middle" font-size="11" fill="#B5C9B0">ESP32 + Buzzer + Tombol Ack</text>
  <text x="960" y="248" text-anchor="middle" font-size="10" fill="#7FB069">Pos pendakian / Warung Tepi Hutan</text>

  <!-- Edge: Pendaki → Basecamp (LoRa) -->
  <line x1="475" y1="220" x2="805" y2="220" stroke="#E8EFE5" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <rect x="595" y="200" width="90" height="22" rx="11"
        fill="#0F1410" stroke="#E8EFE5" stroke-width="1"/>
  <text x="640" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#E8EFE5">LoRa SX1276</text>

  <!-- ════════ LAYER 2: CLOUD ════════ -->

  <!-- Container background untuk cloud layer -->
  <rect x="180" y="320" width="920" height="180" rx="16"
        fill="#141A14" stroke="#2A3A2A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="340" font-size="10" font-weight="600" fill="#7FB069" letter-spacing="1">
    GCP VM · DOCKER COMPOSE · NGINX TLS
  </text>

  <!-- MQTT Broker -->
  <g filter="url(#glow)">
    <ellipse cx="290" cy="425" rx="100" ry="42" fill="#1A2620" stroke="#7FB069" stroke-width="2"/>
  </g>
  <text x="290" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">MQTT Broker</text>
  <text x="290" y="438" text-anchor="middle" font-size="11" fill="#B5C9B0">Mosquitto 2 · QoS 1</text>

  <!-- Backend Rust (center, lebih besar) -->
  <g filter="url(#glow)">
    <ellipse cx="640" cy="425" rx="130" ry="55" fill="#1F2D1F" stroke="#F5B700" stroke-width="2.5"/>
  </g>
  <text x="640" y="412" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">Backend Rust</text>
  <text x="640" y="432" text-anchor="middle" font-size="11" fill="#B5C9B0">Actix-web · Geofence Engine</text>
  <text x="640" y="450" text-anchor="middle" font-size="10" fill="#F5B700">Auto-Alert (3 jenis)</text>

  <!-- PostgreSQL -->
  <g filter="url(#glow)">
    <ellipse cx="990" cy="425" rx="100" ry="42" fill="#1A2620" stroke="#7FB069" stroke-width="2"/>
  </g>
  <text x="990" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">PostgreSQL 15</text>
  <text x="990" y="438" text-anchor="middle" font-size="11" fill="#B5C9B0">log_sensor · pendaki</text>

  <!-- Edges di Layer 2 (between cloud nodes) -->
  <line x1="390" y1="425" x2="510" y2="425" stroke="#7FB069" stroke-width="2"
        marker-end="url(#arrow-mint)" marker-start="url(#arrow-mint)"/>
  <line x1="770" y1="425" x2="890" y2="425" stroke="#7FB069" stroke-width="2"
        marker-end="url(#arrow-mint)" marker-start="url(#arrow-mint)"/>

  <!-- Edge: Basecamp → Cloud (WiFi/MQTT, downward) -->
  <path d="M 960 270 Q 960 295 290 295 Q 290 320 290 383" fill="none"
        stroke="#E8EFE5" stroke-width="2" stroke-dasharray="6 4"
        marker-end="url(#arrow-light)"/>
  <rect x="585" y="282" width="125" height="22" rx="11"
        fill="#0F1410" stroke="#E8EFE5" stroke-width="1"/>
  <text x="647" y="297" text-anchor="middle" font-size="11" font-weight="600" fill="#E8EFE5">WiFi · MQTT publish</text>

  <!-- Edge: Backend → Basecamp (alert downlink, balik atas) -->
  <path d="M 770 410 Q 1130 410 1130 220 Q 1130 195 1115 195" fill="none"
        stroke="#F5B700" stroke-width="2" stroke-dasharray="2 4"
        marker-end="url(#arrow-amber)"/>
  <rect x="1145" y="305" width="105" height="22" rx="11"
        fill="#0F1410" stroke="#F5B700" stroke-width="1"/>
  <text x="1197" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#F5B700">alert otomatis</text>

  <!-- ════════ LAYER 3: DASHBOARD ════════ -->

  <!-- Web Dashboard (lebar, di tengah bawah) -->
  <g filter="url(#glow)">
    <rect x="285" y="600" width="710" height="80" rx="40"
          fill="#1A2620" stroke="#7FB069" stroke-width="2"/>
  </g>
  <text x="640" y="630" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">
    Web Dashboard — altivex-pangrango.duckdns.org
  </text>
  <text x="640" y="652" text-anchor="middle" font-size="11" fill="#B5C9B0">
    Leaflet.js (peta) · Turf.js (geofence) · WebSocket real-time
  </text>
  <text x="640" y="668" text-anchor="middle" font-size="10" fill="#7FB069">
    Tracking · Banner alert · Riwayat polyline · Export Excel
  </text>

  <!-- Edge: Backend → Dashboard (WebSocket) -->
  <line x1="640" y1="480" x2="640" y2="600" stroke="#7FB069" stroke-width="2"
        marker-end="url(#arrow-mint)"/>
  <rect x="555" y="528" width="170" height="22" rx="11"
        fill="#0F1410" stroke="#7FB069" stroke-width="1"/>
  <text x="640" y="543" text-anchor="middle" font-size="11" font-weight="600" fill="#7FB069">
    WebSocket / REST API
  </text>

  <!-- ════════ LEGEND (pojok kanan bawah) ════════ -->
  <g transform="translate(1050, 575)" font-size="10" fill="#9DA8A0">
    <text x="0" y="0" font-weight="700" fill="#FFFFFF" letter-spacing="1">LEGENDA</text>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#E8EFE5" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="26" y="18">jalur LoRa / WiFi</text>
    <line x1="0" y1="32" x2="20" y2="32" stroke="#7FB069" stroke-width="2"/>
    <text x="26" y="36">jalur internal cloud</text>
    <line x1="0" y1="50" x2="20" y2="50" stroke="#F5B700" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="26" y="54">alert otomatis</text>
  </g>

</svg>
